<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamCell — 수주건 사유 입력</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo',Arial,sans-serif;background:linear-gradient(135deg,#e8f0fa 0%,#d4e6f4 50%,#c8d8ea 100%);min-height:100vh;padding:20px 16px 60px;}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(40,80,140,.13);max-width:860px;margin:0 auto;}
.header{padding:24px 28px 20px;border-bottom:1px solid #e8f0f8;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.header-logo{width:38px;height:38px;background:linear-gradient(135deg,#4a7fc1,#3a65a8);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;flex-shrink:0;}
.header-info{}
.header-title{font-size:17px;font-weight:800;color:#1a2a3a;}
.header-sub{font-size:12.5px;color:#4a6a8a;margin-top:2px;}
.ym-badge{background:#e8f0fa;color:#4a7fc1;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;}
.body{padding:20px 28px 28px;}
.loading{text-align:center;padding:60px 20px;color:#4a6a8a;font-size:15px;}
.spinner{width:36px;height:36px;border:3px solid #d0dcea;border-top-color:#4a7fc1;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:#fffbeb;border:1px solid #f0d060;border-radius:12px;padding:12px 16px;font-size:12.5px;color:#7a5800;margin-bottom:18px;line-height:1.6;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:#f4f8fc;}
th{padding:10px 12px;text-align:left;color:#4a6a8a;font-size:11.5px;font-weight:700;white-space:nowrap;border-bottom:1.5px solid #d8e8f5;}
td{padding:8px 12px;border-bottom:1px solid #eef2f8;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.mg{font-weight:700;color:#d95f5f;}
textarea.reason-input{width:100%;min-height:38px;border:1.5px solid #d0dcea;border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;resize:vertical;outline:none;line-height:1.5;transition:border-color .15s;}
textarea.reason-input:focus{border-color:#4a7fc1;background:#fafcff;}
textarea.reason-input.filled{border-color:#2e9e6e;background:#f4fbf7;}
.footer{padding:18px 28px;border-top:1px solid #e8f0f8;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.btn-save{padding:11px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,#4a7fc1,#3a65a8);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-save:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(74,127,193,.35);}
.btn-save:disabled{opacity:.45;cursor:not-allowed;}
.save-status{font-size:13px;color:#4a6a8a;}
.done-box{display:none;background:#f0fbf5;border:1.5px solid #2e9e6e;border-radius:12px;padding:14px 18px;font-size:14px;font-weight:700;color:#1a7a52;text-align:center;margin:18px 28px;}
.empty{text-align:center;padding:60px 20px;color:#8aa0b8;font-size:14px;}
.count-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.count-item{background:#f0f5fb;border-radius:8px;padding:8px 14px;font-size:12.5px;}
.count-item b{color:#1a2a3a;}
.count-item span{color:#4a6a8a;font-size:11.5px;}
@media(max-width:600px){
  .body{padding:16px 16px 20px;}
  .header{padding:18px 16px 14px;}
  .footer{padding:14px 16px;}
  th:nth-child(3),td:nth-child(3){display:none;}
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-logo">DC</div>
    <div class="header-info">
      <div class="header-title" id="hdr-title">수주건 사유 입력</div>
      <div class="header-sub">해당 수주건의 마진율 저조 사유를 입력해주세요</div>
    </div>
    <div class="ym-badge" id="hdr-ym" style="margin-left:auto;"></div>
  </div>

  <div class="body">
    <div class="loading" id="loading-area">
      <div class="spinner"></div>
      데이터를 불러오는 중...
    </div>

    <div id="main-area" style="display:none;">
      <div class="notice">
        ⚠️ 각 수주건의 마진율 저조 사유를 입력 후 하단 <b>전체 저장</b> 버튼을 눌러주세요.<br>
        저장된 사유는 관리자 시스템에 자동으로 반영됩니다.
      </div>
      <div class="count-bar">
        <div class="count-item"><b id="cnt-total">0</b><span>건 전체</span></div>
        <div class="count-item"><b id="cnt-filled" style="color:#2e9e6e">0</b><span>건 입력 완료</span></div>
        <div class="count-item"><b id="cnt-remain" style="color:#d95f5f">0</b><span>건 미입력</span></div>
      </div>
      <div style="overflow-x:auto;border-radius:12px;border:1px solid #e0e8f0;">
        <table>
          <thead><tr>
            <th>수주일</th>
            <th>수주처</th>
            <th>코드</th>
            <th>품명</th>
            <th>마진율</th>
            <th style="min-width:220px;">사유 입력 <span style="font-weight:400;color:#aaa;">(필수)</span></th>
          </tr></thead>
          <tbody id="reason-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="empty" id="empty-area" style="display:none;">
      해당 월의 수주건이 없습니다.
    </div>
  </div>

  <div class="done-box" id="done-box">
    ✅ 사유가 성공적으로 저장되었습니다! 창을 닫으셔도 됩니다.
  </div>

  <div class="footer" id="footer-area" style="display:none;">
    <button class="btn-save" id="save-btn" onclick="saveAllReasons()">💾 전체 저장</button>
    <span class="save-status" id="save-status"></span>
  </div>
</div>

<script>
const SUPA_URL = 'https://fhlowhfqgmjnmzgvmjsi.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZobG93aGZxZ21qbm16Z3ZtanNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5ODU2NDgsImV4cCI6MjEwMTU2MTY0OH0.eW5_u_52wxD9UBPo_FzDgs6CqKqzTZPZO_j703gj1ps';
const hdrs = {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};

const params = new URLSearchParams(location.search);
const ORD = params.get('ord') || '';
const YM  = params.get('ym')  || '';

document.getElementById('hdr-title').textContent = ORD ? `👤 ${ORD}님의 수주건` : '수주건 사유 입력';
document.getElementById('hdr-ym').textContent = YM || '전체';
document.title = `${ORD} 사유 입력 — DreamCell`;

async function loadData() {
  if(!ORD){ showEmpty('URL에 담당자 정보가 없습니다. 관리자에게 문의하세요.'); return; }
  let url = `${SUPA_URL}/rest/v1/orders?orderer=eq.${encodeURIComponent(ORD)}&select=*&order=order_date.asc&limit=300`;
  if(YM) {
    const [y,m] = YM.split('-');
    const nm = m==='12' ? `${parseInt(y)+1}-01` : `${y}-${String(parseInt(m)+1).padStart(2,'0')}`;
    url += `&created_at=gte.${YM}-01T00:00:00&created_at=lt.${nm}-01T00:00:00`;
  }
  try {
    const res = await fetch(url, {headers:hdrs});
    const rows = await res.json();
    if(!rows || rows.error){ showEmpty('데이터를 불러올 수 없습니다.'); return; }
    if(!rows.length){ showEmpty('해당 월의 수주건이 없습니다.'); return; }
    // 중복 제거 (order_date + item_code 기준, 사유 있는 것 우선)
    const dedupeMap = new Map();
    rows.forEach(r => {
      const key = `${r.order_date}|${r.item_code}`;
      if(!dedupeMap.has(key) || (r.reason && !dedupeMap.get(key).reason)) {
        dedupeMap.set(key, r);
      }
    });
    // 반올림 후 10% 미만만 표시 (9.5→10 제외, 9.4→9 포함)
    const deduped = [...dedupeMap.values()].filter(r =>
      r.margin_rate != null && Math.round(r.margin_rate) < 10
    );

    renderTable(deduped);
  } catch(e) {
    showEmpty('오류: ' + e.message);
  }
}

function renderTable(rows) {
  document.getElementById('loading-area').style.display = 'none';
  document.getElementById('main-area').style.display = 'block';
  document.getElementById('footer-area').style.display = 'flex';

  const tbody = document.getElementById('reason-tbody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td style="white-space:nowrap;color:#4a6a8a;">${(r.order_date||'').slice(0,10)}</td>
      <td>${r.customer_name||'—'}</td>
      <td style="color:#5a7a9a;font-size:12px;white-space:nowrap;">${r.item_code||'—'}</td>
      <td style="max-width:200px;">${r.item_name||'—'}</td>
      <td class="mg">${r.margin_rate!=null?Math.round(r.margin_rate)+'%':'—'}</td>
      <td>
        <textarea class="reason-input ${r.reason?'filled':''}"
          data-id="${r.id}"
          placeholder="마진율 저조 사유를 입력해주세요..."
          oninput="onReasonInput(this)"
        >${r.reason||''}</textarea>
      </td>
    </tr>
  `).join('');

  updateCount();
}

function onReasonInput(el) {
  el.classList.toggle('filled', el.value.trim().length > 0);
  updateCount();
}

function updateCount() {
  const all = document.querySelectorAll('textarea.reason-input');
  const filled = [...all].filter(t=>t.value.trim()).length;
  document.getElementById('cnt-total').textContent = all.length;
  document.getElementById('cnt-filled').textContent = filled;
  document.getElementById('cnt-remain').textContent = all.length - filled;
}

async function saveAllReasons() {
  const all = document.querySelectorAll('textarea.reason-input[data-id]');
  const updates = [...all].map(t=>({id:t.dataset.id, reason:t.value.trim()})).filter(u=>u.reason);
  if(!updates.length){ alert('입력된 사유가 없습니다.'); return; }

  const btn = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  btn.disabled = true; btn.textContent = '저장 중...';
  status.textContent = `${updates.length}건 저장 중...`;

  try {
    let done = 0;
    for(const {id, reason} of updates) {
      await fetch(`${SUPA_URL}/rest/v1/orders?id=eq.${id}`, {
        method:'PATCH',
        headers:{...hdrs,'Content-Type':'application/json','Prefer':'return=minimal'},
        body: JSON.stringify({reason, reason_at: new Date().toISOString()})
      });
      done++;
      status.textContent = `${done}/${updates.length} 저장 중...`;
    }
    btn.textContent = '✔ 저장 완료';
    status.textContent = `총 ${done}건 저장되었습니다.`;
    document.getElementById('done-box').style.display = 'block';
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '💾 전체 저장';
    status.textContent = '오류: ' + e.message;
  }
}

function showEmpty(msg) {
  document.getElementById('loading-area').style.display = 'none';
  const el = document.getElementById('empty-area');
  el.style.display = 'block';
  el.textContent = msg;
}

loadData();
</script>
</body>
</html>
